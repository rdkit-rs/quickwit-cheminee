name: Cheminee worker similarity POC

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "quickwit/tantivy-rdkit/**"
      - "quickwit/quickwit-query/**"
      - "quickwit/quickwit-doc-mapper/**"
      - "quickwit/quickwit-serve/**"
      - "quickwit/Cargo.*"
      - ".github/workflows/cheminee-poc.yml"

permissions:
  contents: read

jobs:
  worker-similarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: quickwit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang lld cmake libssl-dev pkg-config
      - name: Test query and API integration
        run: |
          cargo test --locked -p tantivy-rdkit -p quickwit-query --lib --tests
          cargo test --locked -p quickwit-doc-mapper chemistry_tests --lib
          cargo test --locked -p quickwit-serve cheminee_api --lib
      - name: Build Quickwit
        run: cargo build --locked -p quickwit-cli --bin quickwit
      - name: Install public-data and generated-client tooling
        run: |
          python -m venv /tmp/cheminee-poc-python
          /tmp/cheminee-poc-python/bin/pip install -r tantivy-rdkit/poc/requirements.txt
      - name: Run distributed parity and generated-client smoke
        run: /tmp/cheminee-poc-python/bin/python tantivy-rdkit/poc/run.py --binary target/debug/quickwit --work-dir /tmp/cheminee-poc-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheminee-poc-evidence
          path: |
            /tmp/cheminee-poc-results/results.json
            /tmp/cheminee-poc-results/openapi.json
            /tmp/cheminee-poc-results/*.log
            /tmp/cheminee-poc-results/index.json
