name: Cheminee distributed predicates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "quickwit/tantivy-rdkit/**"
      - "quickwit/tantivy-rdkit-mapper/**"
      - "quickwit/quickwit-indexing/**"
      - "quickwit/quickwit-ingest/**"
      - "quickwit/quickwit-cli/**"
      - "quickwit/quickwit-query/**"
      - "quickwit/quickwit-doc-mapper/**"
      - "quickwit/quickwit-serve/**"
      - "quickwit/Cargo.*"
      - "quickwit/vendor/**"
      - "quickwit/scripts/ci/*compatibility*"
      - "quickwit/scripts/ci/lru-parent-compatibility/**"
      - ".github/workflows/cheminee-poc.yml"

permissions:
  contents: read

jobs:
  worker-similarity:
    runs-on: ubuntu-24.04
    container: ubuntu@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 90
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      PKG_CONFIG_PATH: /opt/cheminee-tensorflow/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/cheminee-tensorflow/lib
      QW_CHEMINEE_MODEL_ASSETS: /opt/cheminee-model/assets
    defaults:
      run:
        working-directory: quickwit
    steps:
      - name: Bootstrap Git before checkout
        working-directory: /
        run: |
          apt-get update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact Git checkout before native builds
        working-directory: .
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          repository="$(pwd -P)"
          # Git runs inside the container; trust only this owned checkout path.
          export GIT_CONFIG_VALUE_0="$repository"
          echo "GIT_CONFIG_VALUE_0=$repository" >> "$GITHUB_ENV"
          test "$(git -c safe.directory="$repository" rev-parse --show-toplevel)" = "$repository"
          test "$(git -c safe.directory="$repository" rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y protobuf-compiler clang lld cmake libssl-dev pkg-config git curl ca-certificates build-essential python3 python3-venv
          bash tantivy-rdkit-mapper/ci/install-rdkit.sh
          python3 tantivy-rdkit-mapper/ci/install-tensorflow.py /opt/cheminee-tensorflow
          bash tantivy-rdkit-mapper/ci/install-descriptor-model.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
      - name: Test query and API integration
        run: |
          cargo test --locked -p quickwit-ingest --lib
          cargo test --locked -p tantivy-rdkit -p tantivy-rdkit-mapper -p quickwit-query --lib --tests
          cargo test --locked -p quickwit-doc-mapper --features native-chemistry chemistry --lib
          cargo test --locked -p quickwit-serve --features native-chemistry cheminee_api --lib
          cargo test --locked -p quickwit-serve --features native-chemistry ensure_schemas_resolve --lib
      - name: Test complete in-process preparation
        run: |
          cargo test --locked -p quickwit-ingest --features descriptor-v1 --lib
          cargo test --locked -p tantivy-rdkit-mapper --features descriptor-v1 --lib
          cargo test --locked -p quickwit-doc-mapper --features descriptor-v1 chemistry --lib
      - name: Build and inspect pure scoring worker
        run: |
          cargo tree --locked -p quickwit-search -e normal > /tmp/scoring-dependencies.txt
          if grep -E 'rdkit-sys|tantivy-rdkit-mapper|[[:space:]]rdkit v|[[:space:]]cxx v' /tmp/scoring-dependencies.txt; then exit 1; fi
          cargo build --locked -p quickwit-cli --bin quickwit
          cp target/debug/quickwit /tmp/quickwit-scoring
          ldd /tmp/quickwit-scoring > /tmp/scoring-linkage.txt
          if grep RDKit /tmp/scoring-linkage.txt; then exit 1; fi
      - name: Build and inspect native indexing and root query binary
        run: |
          cargo build --locked -p quickwit-cli --features descriptor-v1 --bin quickwit
          ldd target/debug/quickwit > /tmp/native-linkage.txt
          grep libRDKitGraphMol.so.2026.09 /tmp/native-linkage.txt
          readelf -d target/debug/quickwit > /tmp/native-dynamic.txt
      - name: Verify full raw-SMILES preparation through REST
        run: |
          python3 tantivy-rdkit-mapper/ci/descriptor-rest.py --binary target/debug/quickwit --work-dir /tmp/cheminee-descriptor-results
          python3 tantivy-rdkit-mapper/ci/descriptor-rest.py --binary target/debug/quickwit --work-dir /tmp/cheminee-descriptor-flat-results --layout flat
      - name: Install public-data and generated-client tooling
        run: |
          python3 -m venv /tmp/cheminee-poc-python
          /tmp/cheminee-poc-python/bin/pip install -r tantivy-rdkit/poc/requirements.txt
      - name: Run distributed parity and generated-client smoke
        run: |
          /tmp/cheminee-poc-python/bin/python tantivy-rdkit/poc/run.py --binary /tmp/quickwit-scoring --work-dir /tmp/cheminee-poc-results
          /tmp/cheminee-poc-python/bin/python tantivy-rdkit/poc/run.py --binary target/debug/quickwit --leaf-binary /tmp/quickwit-scoring --raw-smiles --work-dir /tmp/cheminee-native-results
      - name: Run exhaustive distributed graph and client parity
        run: /tmp/cheminee-poc-python/bin/python tantivy-rdkit/poc/graph.py --binary target/debug/quickwit --work-dir /tmp/cheminee-graph-results
      - name: Verify fingerprint-only workers reject graph search
        run: /tmp/cheminee-poc-python/bin/python tantivy-rdkit/poc/graph.py --binary target/debug/quickwit --leaf-binary /tmp/quickwit-scoring --expect-native-unavailable --work-dir /tmp/cheminee-no-native-results
      - name: Lint chemistry integration
        run: cargo clippy --locked -p quickwit-ingest -p tantivy-rdkit -p tantivy-rdkit-mapper -p quickwit-doc-mapper -p quickwit-serve --features quickwit-serve/native-chemistry --tests -- -D warnings
      - name: Test index compatibility oracle and lifecycle
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ci -p test_index_restart_compatibility.py -v
      - name: Qualify Chitchat peers across the LRU repair
        run: |
          set -euo pipefail
          harness="$PWD/scripts/ci/lru-parent-compatibility"
          for mode in baseline candidate; do
            package="/tmp/chitchat-$mode"
            mkdir "$package"
            cp "$harness/Cargo.toml" "$harness/peer.rs" "$harness/observed_udp.rs" "$package/"
            cp "$harness/$mode.lock" "$package/Cargo.lock"
            if [ "$mode" = candidate ]; then
              printf '\n[patch.crates-io]\nlru = { path = "%s/vendor/lru-0.17.0" }\n' "$PWD" >> "$package/Cargo.toml"
            fi
            cargo build --locked -j 1 --manifest-path "$package/Cargo.toml" --target-dir /tmp/chitchat-target
            cp /tmp/chitchat-target/debug/lru-chitchat-peer "/tmp/chitchat-$mode-peer"
            cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 \
              --manifest-path "$package/Cargo.toml" > "$package/metadata.json"
          done
          python3 "$harness/run_udp.py" --baseline /tmp/chitchat-baseline-peer \
            --candidate /tmp/chitchat-candidate-peer --evidence /tmp/chitchat-compatibility \
            --workspace "$GITHUB_WORKSPACE"
      - name: Qualify production index across the LRU repair
        run: |
          # The helper checks out the exact baseline temporarily. Run its copy
          # outside the checkout, and restore the candidate even on failure.
          cp scripts/ci/build_index_compatibility_pair.sh /tmp/build-index-compatibility-pair.sh
          bash /tmp/build-index-compatibility-pair.sh /tmp/cheminee-compatibility-binaries
          python3 scripts/ci/index_restart_compatibility.py \
            --baseline-binary /tmp/cheminee-compatibility-binaries/baseline \
            --candidate-binary /tmp/cheminee-compatibility-binaries/candidate \
            --baseline-revision "$(cat /tmp/cheminee-compatibility-binaries/baseline-revision)" \
            --candidate-revision "$(cat /tmp/cheminee-compatibility-binaries/candidate-revision)" \
            --work-dir /tmp/cheminee-index-compatibility --port 18380
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheminee-poc-evidence
          path: |
            /tmp/chitchat-compatibility/**
            /tmp/chitchat-baseline/metadata.json
            /tmp/chitchat-candidate/metadata.json
            /tmp/cheminee-index-compatibility/result.json
            /tmp/cheminee-index-compatibility/*.log
            /tmp/cheminee-index-compatibility/*.json
            /tmp/cheminee-index-compatibility/http/*.json
            /tmp/cheminee-compatibility-binaries/SHA256SUMS
            /tmp/cheminee-compatibility-binaries/*-revision
            /tmp/cheminee-descriptor-results/**
            /tmp/cheminee-descriptor-flat-results/**
            /tmp/cheminee-poc-results/results.json
            /tmp/cheminee-poc-results/openapi.json
            /tmp/cheminee-poc-results/*.log
            /tmp/cheminee-poc-results/index.json
            /tmp/cheminee-native-results/results.json
            /tmp/cheminee-native-results/openapi.json
            /tmp/cheminee-native-results/*.log
            /tmp/cheminee-native-results/index.json
            /tmp/cheminee-native-results/ingested.ndjson
            /tmp/cheminee-no-native-results/results.json
            /tmp/cheminee-no-native-results/*.log
            /tmp/cheminee-graph-results/results.json
            /tmp/cheminee-graph-results/openapi.json
            /tmp/cheminee-graph-results/*.log
            /tmp/cheminee-graph-results/*-metrics.txt
            /tmp/cheminee-graph-results/*-mapping.json
            /tmp/cheminee-graph-results/molecules.ndjson
            /tmp/*-linkage.txt
            /tmp/native-dynamic.txt
            /tmp/scoring-dependencies.txt
