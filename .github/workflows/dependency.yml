name: "Dependency Review"
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR head and history for the merge base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test comparison, vendor provenance and fail-closed behavior
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s quickwit/scripts/ci -p test_dependency_audit.py
      - name: Install checksum-pinned cargo-audit and fetch current RustSec database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-audit"
          cd "$RUNNER_TEMP/dependency-audit"
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz \
            --output cargo-audit.tgz
          echo '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  cargo-audit.tgz' | sha256sum --check --strict
          tar -xzf cargo-audit.tgz --strip-components=1 \
            cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit
          git clone --depth 1 https://github.com/RustSec/advisory-db.git advisory-db
      - name: Verify vendor provenance and compare raw and registry-identity RustSec scans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency-audit/report"
          git merge-base "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/dependency-audit/report/base-sha.txt"
          git show "$(cat "$RUNNER_TEMP/dependency-audit/report/base-sha.txt"):quickwit/Cargo.lock" > "$RUNNER_TEMP/dependency-audit/base.lock"
          git show "$HEAD_SHA:quickwit/Cargo.lock" > "$RUNNER_TEMP/dependency-audit/head.lock"
          printf '%s\n' "$HEAD_SHA" > "$RUNNER_TEMP/dependency-audit/report/head-sha.txt"
          # Invoke the binary outside the checkout: never resolve/build the PR's Cargo project.
          cd "$RUNNER_TEMP/dependency-audit"
          python3 "$GITHUB_WORKSPACE/quickwit/scripts/ci/dependency_audit.py" \
            --scanner "$PWD/cargo-audit" --database "$PWD/advisory-db" \
            --base-lock "$PWD/base.lock" --head-lock "$PWD/head.lock" --output "$PWD/report" \
            --repository "$GITHUB_WORKSPACE" \
            --base-ref "$(cat "$PWD/report/base-sha.txt")" --head-ref "$HEAD_SHA"
      - name: Publish complete findings and coverage summary
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/dependency-audit/report/summary.md"; then
            cat "$RUNNER_TEMP/dependency-audit/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw and projected locks, reports, hashes and validated vendor provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dependency-audit/report/
          retention-days: 14
          if-no-files-found: warn
